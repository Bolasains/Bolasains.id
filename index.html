<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bolasains.id — Academy Management</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #172033;
}

header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.logo span {
  color: #f97316;
}

.user {
  color: #6b7280;
  font-size: 14px;
}

.container {
  display: flex;
  min-height: calc(100vh - 65px);
}

.sidebar {
  width: 220px;
  background: #111827;
  padding: 25px 15px;
}

.sidebar button {
  width: 100%;
  border: none;
  background: transparent;
  color: #d1d5db;
  text-align: left;
  padding: 13px 15px;
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  font-size: 14px;
}

.sidebar button:hover,
.sidebar button.active {
  background: #1f2937;
  color: white;
}

.main {
  flex: 1;
  padding: 35px;
  max-width: 1200px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 30px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 30px;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 22px;
}

.card-title {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 8px;
}

.card-number {
  font-size: 30px;
  font-weight: bold;
}

.panel {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 25px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.panel h2 {
  font-size: 19px;
}

.btn {
  border: none;
  background: #f97316;
  color: white;
  padding: 11px 17px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.btn:hover {
  opacity: 0.9;
}

.btn-secondary {
  background: #e5e7eb;
  color: #374151;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 13px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
}

th {
  color: #6b7280;
}

.empty {
  text-align: center;
  color: #9ca3af;
  padding: 35px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: 1 / -1;
}

label {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
select {
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 14px;
}

.form-actions {
  margin-top: 25px;
  display: flex;
  gap: 10px;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #dcfce7;
  color: #166534;
  font-size: 12px;
}

.action-btn {
  border: none;
  background: none;
  cursor: pointer;
  color: #f97316;
  font-size: 13px;
}

@media (max-width: 800px) {
  .sidebar {
    width: 75px;
  }

  .sidebar button {
    font-size: 0;
    text-align: center;
  }

  .sidebar button:first-letter {
    font-size: 20px;
  }

  .main {
    padding: 20px;
  }

  .cards {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 600px) {
  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: auto;
  }

  table {
    min-width: 650px;
  }

  .panel {
    overflow-x: auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">bola<span>sains</span>.id</div>
  <div class="user">Academy Management</div>
</header>

<div class="container">

  <aside class="sidebar">

    <button class="active" onclick="showPage('dashboard', this)">
      🏠 Dashboard
    </button>

    <button onclick="showPage('players', this)">
      👤 Pemain
    </button>

    <button onclick="showPage('attendance', this)">
      📋 Kehadiran
    </button>

    <button onclick="showPage('fees', this)">
      💰 Iuran
    </button>

  </aside>

  <main class="main">

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">

      <h1>Dashboard</h1>
      <p class="subtitle">
        Kelola data dan operasional akademi.
      </p>

      <div class="cards">

        <div class="card">
          <div class="card-title">Pemain Aktif</div>
          <div class="card-number" id="totalPlayers">0</div>
        </div>

        <div class="card">
          <div class="card-title">Kehadiran</div>
          <div class="card-number">0%</div>
        </div>

        <div class="card">
          <div class="card-title">Iuran Lunas</div>
          <div class="card-number">0</div>
        </div>

        <div class="card">
          <div class="card-title">Belum Lunas</div>
          <div class="card-number">0</div>
        </div>

      </div>

      <div class="panel">

        <div class="panel-header">
          <h2>Pemain Terbaru</h2>
        </div>

        <div id="dashboardPlayers"></div>

      </div>

    </section>


    <!-- PEMAIN -->
    <section id="players" class="page">

      <h1>Pemain</h1>
      <p class="subtitle">
        Data pemain akademi.
      </p>

      <div class="panel">

        <div class="panel-header">

          <h2>Daftar Pemain</h2>

          <button class="btn" onclick="showAddPlayer()">
            + Tambah Pemain
          </button>

        </div>

        <div id="playerTable"></div>

      </div>

    </section>


    <!-- TAMBAH PEMAIN -->
    <section id="addPlayer" class="page">

      <h1>Tambah Pemain</h1>
      <p class="subtitle">
        Masukkan data pemain baru.
      </p>

      <div class="panel">

        <form onsubmit="savePlayer(event)">

          <div class="form-grid">

            <div class="form-group">
              <label>Nama Pemain</label>
              <input id="playerName" type="text" required>
            </div>

            <div class="form-group">
              <label>Tanggal Lahir</label>
              <input id="birthDate" type="date" required>
            </div>

            <div class="form-group">
              <label>Nama Orang Tua</label>
              <input id="parentName" type="text" required>
            </div>

            <div class="form-group">
              <label>WhatsApp</label>
              <input id="phone" type="tel" placeholder="08xxxxxxxxxx">
            </div>

            <div class="form-group">
              <label>Posisi</label>

              <select id="position" required>
                <option value="">
