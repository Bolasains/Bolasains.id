<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolasains.id — Academy Management</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #172033;
}

header {
  background: #ffffff;
  padding: 18px 25px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.logo span {
  color: #f97316;
}

.user {
  font-size: 14px;
  color: #6b7280;
}

.container {
  display: flex;
  min-height: calc(100vh - 65px);
}

.sidebar {
  width: 220px;
  background: #111827;
  padding: 25px 15px;
}

.sidebar a {
  display: block;
  color: #d1d5db;
  text-decoration: none;
  padding: 13px 15px;
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 14px;
}

.sidebar a:hover {
  background: #1f2937;
  color: white;
}

.main {
  flex: 1;
  padding: 35px;
}

h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 30px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 35px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}

.card-title {
  font-size: 14px;
  color: #6b7280;
  margin-bottom: 10px;
}

.card-number {
  font-size: 30px;
  font-weight: 700;
}

.section {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 25px;
}

.section h2 {
  font-size: 19px;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 13px 10px;
  text-align: left;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

th {
  color: #6b7280;
  font-weight: 600;
}

.status {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  background: #dcfce7;
  color: #166534;
}

@media (max-width: 800px) {
  .sidebar {
    width: 70px;
  }

  .sidebar a {
    font-size: 0;
    text-align: center;
  }

  .sidebar a::first-letter {
    font-size: 20px;
  }

  .main {
    padding: 20px;
  }

  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .cards {
    grid-template-columns: 1fr 1fr;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">bola<span>sains</span>.id</div>
  <div class="user">Academy Management</div>
</header>

<div class="container">

  <aside class="sidebar">
    <a href="#">🏠 Dashboard</a>
    <a href="#">👤 Pemain</a>
    <a href="#">📋 Kehadiran</a>
    <a href="#">💰 Iuran</a>
  </aside>

  <main class="main">

    <h1>Dashboard</h1>
    <p class="subtitle">
      Kelola data pemain dan operasional akademi.
    </p>

    <div class="cards">

      <div class="card">
        <div class="card-title">Pemain Aktif</div>
        <div class="card-number">0</div>
      </div>

      <div class="card">
        <div class="card-title">Kehadiran</div>
        <div class="card-number">0%</div>
      </div>

      <div class="card">
        <div class="card-title">Iuran Lunas</div>
        <div class="card-number">0</div>
      </div>

      <div class="card">
        <div class="card-title">Belum Lunas</div>
        <div class="card-number">0</div>
      </div>

    </div>

    <div class="section">

      <h2>Pemain Terbaru</h2>

      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Usia</th>
            <th>Posisi</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Belum ada pemain</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
          </tr>
        </tbody>

      </table>

    </div>

  </main>

</div>

</body>
</html>
